<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>miraclescan.me · Miracle Scanner</title>
  <meta name="description" content="miraclescan.me - join the investigation. Character intel for Tibia Miracle 7.4.">
  <meta name="theme-color" content="#13151c">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=13">
  <script src="js/config.js?v=13"></script>
  <script src="js/icons.js?v=13"></script>
  <script src="js/theme.js?v=13"></script>
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="menu-toggle" class="btn btn-ghost btn-icon only-mobile" type="button" data-icon="menu"
            data-i18n-aria="nav.menu" data-i18n-title="nav.menu"></button>
    <div class="brand">
      <a href="#investigation" class="brand-home" aria-label="miraclescan.me"><img class="logo-px" src="assets/icons/logo.svg" alt=""></a>
      <div>
        <div class="brand-title" data-i18n="app.title">Miracle Scanner</div>
        <div class="brand-sub" data-i18n="app.subtitle"></div>
      </div>
    </div>
    <div class="topbar-tools">
      <div id="health" class="health" role="status">
        <span id="health-dot" class="dot"></span><span id="health-label" data-i18n="health.offline"></span>
      </div>
      <a id="online-count" class="online-count" href="#online" hidden></a>
      <div class="lang-switch" data-i18n-title="lang.change">
        <span data-icon="globe"></span>
        <div id="lang-switch" class="row" role="group" data-i18n-aria="lang.change"></div>
      </div>
      <label class="tz" data-i18n-title="timezone.label">
        <span id="tz-icon" class="icon-wrap"></span>
        <select id="tz-select" data-i18n-aria="timezone.label"></select>
        <span id="tz-offset" class="tz-offset"></span>
      </label>
      <button id="theme-toggle" class="btn btn-icon" type="button" data-i18n-title="theme.toggle"
              data-i18n-aria="theme.toggle"></button>
    </div>
  </header>

  <nav class="sidebar" aria-label="nav">
    <div class="nav-section" data-i18n="nav.section.analysis"></div>
    <a class="nav-item" href="#investigation" data-nav="investigation"><span data-icon="investigation"></span><span data-i18n="nav.investigation"></span></a>
    <a class="nav-item" href="#guilds" data-nav="guilds"><span data-icon="guild"></span><span data-i18n="nav.guilds"></span></a>
    <a class="nav-item" href="#compare" data-nav="compare"><span data-icon="compare"></span><span data-i18n="nav.compare"></span></a>
    <a class="nav-item" href="#clusters" data-nav="clusters"><span data-icon="clusters"></span><span data-i18n="nav.clusters"></span></a>
    <div class="nav-section" data-i18n="nav.section.monitor"></div>
    <a class="nav-item" href="#highscores" data-nav="highscores"><span data-icon="highscore"></span><span data-i18n="nav.highscores"></span></a>
    <a class="nav-item" href="#online" data-nav="online"><span data-icon="online"></span><span data-i18n="nav.online"></span></a>
    <a class="nav-item" href="#powergamers" data-nav="powergamers"><span data-icon="powergamers"></span><span data-i18n="nav.powergamers"></span></a>
    <a class="nav-item" href="#insomniacs" data-nav="insomniacs"><span data-icon="insomniacs"></span><span data-i18n="nav.insomniacs"></span></a>
    <a class="nav-item" href="#deaths" data-nav="deaths"><span data-icon="deaths"></span><span data-i18n="nav.deaths"></span></a>
    <a class="nav-item" href="#bans" data-nav="bans"><span data-icon="bans"></span><span data-i18n="nav.bans"></span></a>
  </nav>

  <main class="main">
    <!-- Investigacao (CSI) -->
    <section id="view-investigation" class="home">
      <div class="inv-hero">
        <div class="torch-glow"></div>
        <div class="hero-inner">
          <img class="hero-logo" src="assets/icons/logo.svg" alt="">
          <h1 class="hero-title">miraclescan.me</h1>
          <p class="hero-sub" data-i18n="hero.tagline"></p>
          <form id="hero-form" class="hero-form" role="search">
            <input id="hero-input" type="text" autocomplete="off" autofocus data-i18n-placeholder="investigation.search" required>
            <button class="btn btn-primary" type="submit" data-i18n="investigation.go"></button>
          </form>
          <p id="hero-hint" class="hero-hint"></p>
        </div>
      </div>
      <form id="inv-form" class="search-bar">
        <input id="inv-input" type="text" autocomplete="off" data-i18n-placeholder="investigation.search" required>
        <button class="btn btn-primary" type="submit"><span data-icon="search"></span><span data-i18n="investigation.go"></span></button>
        <button id="export-png" class="btn" type="button"><span data-icon="image"></span><span data-i18n="export.png"></span></button>
        <button id="export-pdf" class="btn" type="button"><span data-icon="file"></span><span data-i18n="export.pdf"></span></button>
      </form>
      <div id="inv-result"><p class="muted" data-i18n="investigation.empty"></p></div>
    </section>

    <!-- Guildas -->
    <section id="view-guilds" hidden>
      <form id="guild-form" class="search-bar">
        <input id="guild-input" type="text" autocomplete="off" data-i18n-placeholder="guilds.search">
        <button class="btn btn-primary" type="submit"><span data-icon="search"></span><span data-i18n="investigation.go"></span></button>
      </form>
      <div id="guild-result"></div>
    </section>

    <!-- Comparador -->
    <section id="view-compare" hidden>
      <h2 class="view-title" data-i18n="compare.select_chars"></h2>
      <form id="cmp-form" class="search-bar">
        <input id="cmp-a" type="text" autocomplete="off" data-i18n-placeholder="compare.char_a" required>
        <input id="cmp-b" type="text" autocomplete="off" data-i18n-placeholder="compare.char_b" required>
        <button class="btn btn-primary" type="submit"><span data-icon="compare"></span><span data-i18n="compare.go"></span></button>
      </form>
      <div id="cmp-result"></div>
    </section>

    <!-- Clusters -->
    <section id="view-clusters" hidden>
      <h2 class="view-title" data-i18n="clusters.ranking"></h2>
      <div id="clusters-list" class="two-col"></div>
    </section>

    <!-- Listas do servidor -->
    <section id="view-highscores" hidden></section>
    <section id="view-online" hidden></section>
    <section id="view-powergamers" hidden></section>
    <section id="view-insomniacs" hidden></section>
    <section id="view-deaths" hidden></section>
    <section id="view-bans" hidden></section>

  </main>
</div>

<aside id="side-panel" class="side-panel" aria-live="polite"></aside>
<div id="toasts" class="toasts"></div>

<script src="js/i18n.js?v=13"></script>
<script src="js/timezone.js?v=13"></script>
<script src="js/auth.js?v=13"></script>
<script src="js/api.js?v=13"></script>
<script src="js/heatmap.js?v=13"></script>
<script src="js/timeline.js?v=13"></script>
<script src="js/graph.js?v=13" defer></script>
<script src="js/investigation.js?v=13" defer></script>
<script src="js/compare.js?v=13" defer></script>
<script src="js/guilds.js?v=13" defer></script>
<script src="js/lists.js?v=13" defer></script>
<script src="js/export.js?v=13" defer></script>
<script src="js/app.js?v=13" defer></script>
</body>
</html>
